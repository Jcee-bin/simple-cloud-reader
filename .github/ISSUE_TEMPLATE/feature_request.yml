name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Product behavior
        - Backend API
        - Windows app
        - Android app
        - Sync contract
        - Documentation or infrastructure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Product scope
      options:
        - label: This keeps navigation simple and does not add an unsupported platform.
          required: true
        - label: This does not require copying ReadEra source, branding, icons, screenshots, or assets.
          required: true
